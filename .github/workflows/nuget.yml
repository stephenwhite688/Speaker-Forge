name: NuGet

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build SpeakerForge.slnx -c Release

      - name: Pack
        run: dotnet pack src/SpeakerForge/SpeakerForge.csproj -c Release --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakerForge-nupkg
          path: src/SpeakerForge/bin/Release/*.nupkg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/SpeakerForge/SpeakerForge.csproj -c Release

      - name: Push to NuGet
        run: dotnet nuget push "src/SpeakerForge/bin/Release/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
